services:
  - type: web
    name: tradechain-platform
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_GROQ_API_KEY
        sync: false
      - key: VITE_GEMINI_API_KEY
        sync: false
